name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
      - '*.*.*'
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag / Version name for the release (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Build Environment
        run: |
          chmod +x gradlew
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Prepare APK Asset
        run: |
          mkdir -p release-apk
          APK_FILE=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -n "$APK_FILE" ]; then
            echo "Found APK at $APK_FILE"
            cp "$APK_FILE" release-apk/FloppaLauncher.apk
            ls -lh release-apk/FloppaLauncher.apk
          else
            echo "Error: No APK file was found in app/build/outputs/apk/debug/"
            exit 1
          fi

      - name: Determine Release Tag and Title
        id: tag_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            TITLE="${{ github.event.release.name }}"
            if [ -z "$TITLE" ]; then
              TITLE="Floppa Launcher ${{ github.event.release.tag_name }}"
            fi
            echo "title=$TITLE" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
            echo "title=Floppa Launcher ${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "title=Floppa Launcher ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            echo "title=Floppa Launcher v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: ${{ steps.tag_info.outputs.title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apk/FloppaLauncher.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
